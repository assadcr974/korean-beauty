<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Korean Beauty by Assa">
  <!-- Coins en équerre -->
  <g stroke="#17301F" stroke-width="1.6" fill="none">
    <!-- Haut gauche -->
    <polyline points="80,80 80,90 90,80 70,80"/>
    <!-- Haut droit -->
    <polyline points="320,80 320,90 310,80 330,80"/>
    <!-- Bas gauche -->
    <polyline points="80,320 80,310 90,320 70,320"/>
    <!-- Bas droit -->
    <polyline points="320,320 320,310 310,320 330,320"/>
  </g>

  <!-- Feuille ovale verticale avec ligne centrale + goutte -->
  <g transform="translate(200 130)">
    <ellipse cx="0" cy="0" rx="32" ry="50" fill="none" stroke="#17301F" stroke-width="1.6"/>
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#17301F" stroke-width="1.4"/>
    <circle cx="0" cy="64" r="8" fill="#7EC49A"/>
  </g>

  <!-- Lignes encadrant KOREAN/BEAUTY -->
  <line x1="100" y1="225" x2="300" y2="225" stroke="#17301F" stroke-width="0.8"/>
  <line x1="100" y1="290" x2="300" y2="290" stroke="#17301F" stroke-width="0.8"/>

  <!-- KOREAN -->
  <text x="200" y="263" text-anchor="middle"
    font-family="'Playfair Display', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="38" font-weight="400"
    fill="#17301F" letter-spacing="4">KOREAN</text>

  <!-- BEAUTY (entre les deux lignes basses) -->
  <text x="200" y="332" text-anchor="middle"
    font-family="'Playfair Display', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="38" font-weight="400"
    fill="#17301F" letter-spacing="4">BEAUTY</text>

  <line x1="100" y1="345" x2="300" y2="345" stroke="#17301F" stroke-width="0.8"/>

  <!-- BY ASSA -->
  <text x="200" y="370" text-anchor="middle"
    font-family="'Playfair Display', 'Palatino Linotype', Palatino, Georgia, serif"
    font-size="11" fill="#7EC49A" letter-spacing="6">BY ASSA</text>
</svg>
